<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1e2640"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <linearGradient id="blade" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fffde0"/>
      <stop offset="40%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#d4960a"/>
    </linearGradient>
    <linearGradient id="guard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#d4960a"/>
    </linearGradient>
  </defs>

  <!-- Background circle with border -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)" stroke="#f5c542" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Outer glow -->
  <circle cx="16" cy="14" r="8" fill="#b388ff" opacity="0.08"/>

  <!-- Sword blade — bold clipart style -->
  <polygon points="16,3 18,13 16,15 14,13" fill="url(#blade)" stroke="#d4960a" stroke-width="0.4" stroke-linejoin="round"/>

  <!-- Blade highlight -->
  <polygon points="16,4 16.8,12 16,14" fill="white" opacity="0.25"/>

  <!-- Crossguard — thick rounded bar -->
  <rect x="10.5" y="14" width="11" height="2.5" rx="1.2" fill="url(#guard)" stroke="#b8860b" stroke-width="0.4"/>

  <!-- Handle -->
  <rect x="14.5" y="16.5" width="3" height="6.5" rx="1" fill="#8B5E3C" stroke="#6B3F1F" stroke-width="0.4"/>

  <!-- Handle wrap lines -->
  <line x1="14.8" y1="18" x2="17.2" y2="18" stroke="#6B3F1F" stroke-width="0.3" opacity="0.5"/>
  <line x1="14.8" y1="19.5" x2="17.2" y2="19.5" stroke="#6B3F1F" stroke-width="0.3" opacity="0.5"/>
  <line x1="14.8" y1="21" x2="17.2" y2="21" stroke="#6B3F1F" stroke-width="0.3" opacity="0.5"/>

  <!-- Pommel — bold circle -->
  <circle cx="16" cy="23.8" r="1.8" fill="#f5c542" stroke="#d4960a" stroke-width="0.4"/>

  <!-- Star sparkles — bigger, bolder -->
  <circle cx="8" cy="7" r="1" fill="#f5c542" opacity="0.9"/>
  <circle cx="8" cy="7" r="0.4" fill="white" opacity="0.8"/>
  <circle cx="24" cy="6" r="0.8" fill="#fff" opacity="0.85"/>
  <circle cx="24" cy="6" r="0.3" fill="white" opacity="0.9"/>
  <circle cx="25" cy="22" r="0.9" fill="#b388ff" opacity="0.85"/>
  <circle cx="7" cy="23" r="0.7" fill="#6c9fff" opacity="0.8"/>
  <circle cx="5" cy="14" r="0.6" fill="#f5c542" opacity="0.6"/>
</svg>
